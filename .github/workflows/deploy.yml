name: Build and deploy portfolio

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !apiToken) {
            throw new Error('CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are required.');
          }

          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/portfolio`;
          const headers = {
            Authorization: `Bearer ${apiToken}`,
            'Content-Type': 'application/json',
          };

          async function request(method, body) {
            const response = await fetch(endpoint, {
              method,
              headers,
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            let payload;
            try {
              payload = await response.json();
            } catch {
              throw new Error(`Cloudflare API returned non-JSON for ${method} (${response.status}).`);
            }
            return { response, payload };
          }

          const existing = await request('GET');
          if (
            existing.response.ok &&
            existing.payload.success &&
            existing.payload.result?.name === 'portfolio'
          ) {
            console.log('Cloudflare Pages project portfolio already exists.');
          } else if (existing.response.status === 404) {
            const created = await request('POST', { name: 'portfolio', production_branch: 'main' });
            if (!created.response.ok || !created.payload.success) {
              const details = JSON.stringify(created.payload.errors ?? created.payload);
              throw new Error(`Could not create Cloudflare Pages project: ${details}`);
            }
            console.log('Created Cloudflare Pages project portfolio.');
          } else {
            const details = JSON.stringify(existing.payload.errors ?? existing.payload);
            throw new Error(`Could not check Cloudflare Pages project: ${details}`);
          }
          NODE

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/prakruthi-portfolio/browser --project-name=portfolio --branch=main
