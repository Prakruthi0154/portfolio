<header class="site-header">
  <a class="brand" href="#home" (click)="closeMenu()" aria-label="Prakruthi B N, home">
    <span class="brand-mark">P<span>.</span></span>
    <span class="brand-name">prakruthi<span>.bn</span></span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle navigation"
  >
    <span></span><span></span>
  </button>

  <nav class="nav-links" [class.is-open]="menuOpen()" aria-label="Main navigation">
    <a href="#about" (click)="closeMenu()">About</a>
    <a href="#skills" (click)="closeMenu()">Skills</a>
    <a href="#journey" (click)="closeMenu()">Journey</a>
    <a href="#work" (click)="closeMenu()">Case study</a>
    <a href="#contact" (click)="closeMenu()">Contact</a>
    <button
      class="theme-toggle"
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.title]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      @if (theme.isDark()) {
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path></svg>
      }
    </button>
  </nav>
</header>
